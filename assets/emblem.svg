<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="50%" stop-color="#FFEAA7" />
      <stop offset="100%" stop-color="#8C6210" />
    </linearGradient>

    <radialGradient id="navyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B2A4A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0A192F" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for 3D bevel & drop shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.83  0 0 0 0 0.68  0 0 0 0 0.21  0 0 0 0.5 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="embossShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Text Curved Paths -->
    <!-- Arc for "BUREAUCRATS HIVE" (Top, outer) -->
    <path id="topArcPath" d="M 85,250 A 165,165 0 0,1 415,250" fill="none" />
    <!-- Arc for "GUIDING AMBITIONS, BUILDING BUREAUCRATS" (Bottom, outer) -->
    <path id="bottomArcPath" d="M 430,250 A 180,180 0 0,1 70,250" fill="none" />
  </defs>

  <circle cx="250" cy="250" r="240" fill="url(#navyGlow)" />

  <!-- Outer Double Ring -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.6" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGradient)" stroke-width="4.5" filter="url(#embossShadow)" />

  <!-- Outer Chain Pattern Ring -->
  <g stroke="url(#goldGradient)" fill="none" stroke-width="3" filter="url(#embossShadow)">
    <circle cx="250" cy="250" r="195" stroke-width="2" stroke-dasharray="14 10" />
    <circle cx="250" cy="250" r="160" stroke-width="2" stroke-dasharray="12 8" />
  </g>

  <!-- Curving Chain Interlocks around perimeter -->
  <g fill="none" stroke="url(#goldGradient)" stroke-width="3.5" filter="url(#embossShadow)">
    <path d="M 75 220 C 65 240, 65 260, 75 280 M 68 235 C 55 250, 55 255, 68 270" />
    <path d="M 425 220 C 435 240, 435 260, 425 280 M 432 235 C 445 250, 445 255, 432 270" />
  </g>

  <!-- Top Text: BUREAUCRATS HIVE -->
  <text font-family="'Cinzel', 'Montserrat', serif" font-size="28" font-weight="900" fill="url(#goldGradient)" letter-spacing="9" filter="url(#goldGlow)">
    <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">
      BUREAUCRATS HIVE
    </textPath>
  </text>

  <!-- Bottom Text: GUIDING AMBITIONS, BUILDING BUREAUCRATS -->
  <text font-family="'Montserrat', sans-serif" font-size="12.5" font-weight="800" fill="url(#goldGradient)" letter-spacing="4" filter="url(#embossShadow)">
    <textPath href="#bottomArcPath" startOffset="50%" text-anchor="middle">
      GUIDING AMBITIONS, BUILDING BUREAUCRATS
    </textPath>
  </text>

  <!-- Central Honeycomb Structure (Hive) -->
  <g stroke="url(#goldGradient)" stroke-width="3.8" fill="none" stroke-linejoin="round" filter="url(#embossShadow)">
    <!-- Central Cluster Hexagons -->
    <polygon points="250,215 272,228 272,253 250,266 228,253 228,228" fill="#112240" fill-opacity="0.4" />
    <polygon points="250,165 272,178 272,203 250,216 228,203 228,178" />
    <polygon points="292,190 314,203 314,228 292,241 270,228 270,203" />
    <polygon points="208,190 230,203 230,228 208,241 186,228 186,203" />
    <polygon points="292,240 314,253 314,278 292,291 270,278 270,253" />
    <polygon points="208,240 230,253 230,278 208,291 186,278 186,253" />
    <polygon points="250,265 272,278 272,303 250,316 228,303 228,278" />
    
    <polygon points="334,215 356,228 356,253 334,266 312,253 312,228" stroke-dasharray="2 1" />
    <polygon points="166,215 188,228 188,253 166,266 144,253 144,228" stroke-dasharray="2 1" />
    
    <polygon points="250,305 275,320 250,342 225,320" fill="url(#goldGradient)" fill-opacity="0.2"/>
  </g>

  <!-- Central Ashoka Lion Capital Motif (Authority & Bureaucracy) -->
  <g transform="translate(200, 130) scale(0.68)" fill="url(#goldGradient)" filter="url(#goldGlow)">
    <path d="M 60 40 C 65 30, 80 30, 85 40 C 90 35, 95 45, 90 55 C 95 65, 80 75, 75 80 C 65 75, 55 65, 58 55 C 55 45, 58 35, 60 40 Z" />
    <circle cx="68" cy="50" r="3" fill="#0A192F" />
    <circle cx="78" cy="50" r="3" fill="#0A192F" />
    <polygon points="73,56 69,63 77,63" fill="#0A192F" />
    <path d="M 68 67 Q 73 72 78 67" stroke="#0A192F" stroke-width="2" fill="none" />
    
    <path d="M 35 48 C 40 38, 55 40, 58 52 C 50 60, 48 70, 40 75 C 32 68, 30 58, 35 48 Z" opacity="0.9" />
    <circle cx="44" cy="56" r="2.5" fill="#0A192F" />
    
    <path d="M 112 48 C 107 38, 92 40, 89 52 C 97 60, 99 70, 107 75 C 115 68, 117 58, 112 48 Z" opacity="0.9" />
    <circle cx="103" cy="56" r="2.5" fill="#0A192F" />

    <path d="M 45 75 Q 73 95 102 75 L 98 105 Q 73 125 49 105 Z" fill="url(#goldShine)" />
    <line x1="73" y1="78" x2="73" y2="115" stroke="#0A192F" stroke-width="2.5" />
    <line x1="62" y1="82" x2="60" y2="110" stroke="#0A192F" stroke-width="2.5" />
    <line x1="84" y1="82" x2="86" y2="110" stroke="#0A192F" stroke-width="2.5" />
    <line x1="52" y1="88" x2="50" y2="105" stroke="#0A192F" stroke-width="2" />
    <line x1="94" y1="88" x2="96" y2="105" stroke="#0A192F" stroke-width="2" />
    
    <rect x="52" y="112" width="9" height="28" rx="3" />
    <rect x="65" y="115" width="8" height="25" rx="3" />
    <rect x="74" y="115" width="8" height="25" rx="3" />
    <rect x="86" y="112" width="9" height="28" rx="3" />
    
    <path d="M 40 140 L 107 140 L 102 147 L 45 147 Z" />
  </g>

  <!-- Central Subtitle: UPSC & BPSC MENTORSHIP -->
  <g filter="url(#goldGlow)">
    <text x="250" y="375" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="21" font-weight="900" fill="url(#goldGradient)" letter-spacing="3.5">
      UPSC &amp; BPSC
    </text>
    <text x="250" y="398" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="14.5" font-weight="700" fill="url(#goldShine)" letter-spacing="5.5">
      MENTORSHIP
    </text>
  </g>
</svg>
